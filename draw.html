<!DOCTYPE html>
<html lang="zh-CN">

    #app { width: 100%; max-width: 1200px; background: white; border-radius: 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; }
    .header { padding: 18px 24px; border-bottom: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .header h2 { font-weight: 700; font-size: 1.5rem; color: #0f172a; display: flex; align-items: center; gap: 10px; }
    .chip { background: #eef2ff; color: #4338ca; padding: 4px 14px; border-radius: 30px; font-size: 0.75rem; font-weight: 600; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .controls select { padding: 8px 16px; border-radius: 20px; border: 1px solid #d1d5db; background: white; font-size: 0.9rem; color: #1f2937; cursor: pointer; outline: none; }
    .stats { display: flex; gap: 24px; background: #f8fafc; padding: 6px 20px; border-radius: 40px; font-size: 0.9rem; font-weight: 500; color: #334155; }
    .legend-container { padding: 12px 24px; background: #f9fafb; border-bottom: 1px solid #eef2f6; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; font-size: 0.8rem; color: #1e293b; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-shape { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .legend-square { width: 18px; height: 18px; border: 2.5px solid #1e293b; border-radius: 3px; background: white; }
    .legend-circle { width: 18px; height: 18px; border: 2.5px solid #1e293b; border-radius: 50%; background: white; }
    .legend-diamond { width: 18px; height: 18px; background: white; border: 2.5px solid #1e293b; transform: rotate(45deg); }
    .legend-filled { background: #1e293b; }
    .legend-half { background: linear-gradient(to right, #1e293b 50%, white 50%); }
    .canvas-area { padding: 16px; display: flex; justify-content: center; background: #ffffff; }
    .konva-wrapper { width: 100%; border-radius: 20px; overflow: hidden; background: #fdfdfd; border: 1px solid #ecf1f7; position: relative; }
    .footer-note { text-align: center; font-size: 0.75rem; color: #64748b; padding: 10px; border-top: 1px solid #f1f5f9; }
    .zoom-tip { position: absolute; bottom: 8px; right: 16px; background: rgba(0,0,0,0.5); color: white; border-radius: 20px; padding: 2px 10px; font-size: 0.7rem; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <h2>🧬 遗传家系图谱<span class="chip">ACMG/ESHG 标准 · 自适应全显优化</span></h2>
    <div class="controls">
      <select v-model="currentCase" @change="loadCase">
        <option v-for="(caseData, key) in allCases" :key="key" :value="key">{{ caseData.pedigree.title }}</option>
      </select>
      <div class="stats">
        <span>👥 {{ currentMemberCount }}</span>
        <span>📅 {{ currentGenCount }}代</span>
        <span>🔍 自适应缩放</span>
      </div>
    </div>
  </div>

        maxY = Math.max(maxY, ...members.map(m => m.positionY + 45));
        
        const contentWidth = maxX - minX;
        const contentHeight = maxY - minY;
        if (contentWidth <= 0 || contentHeight <= 0) return;
        
        const stageWidth = this.stage.width();
        const stageHeight = this.stage.height();
        const scaleX = (stageWidth - padding * 2) / contentWidth;
        const scaleY = (stageHeight - padding * 2) / contentHeight;
        const scale = Math.min(scaleX, scaleY, 1.8); // 最大缩放1.8倍防止过大模糊，保证全部显示
        // 重置变换后再应用新变换
        this.stage.scale({ x: 1, y: 1 });
        this.stage.position({ x: 0, y: 0 });
        // 计算偏移使得内容居中
        const centerX = (minX + maxX) / 2;
        const centerY = (minY + maxY) / 2;
        const newX = stageWidth / 2 - centerX * scale;
        const newY = stageHeight / 2 - centerY * scale;
        this.stage.scale({ x: scale, y: scale });
        this.stage.position({ x: newX, y: newY });
        this.layer.batchDraw();
      },
      drawPedigree() {
        if (!this.layer || !this.currentData) return;
        this.layer.destroyChildren();
        const members = this.currentData.members;
        const relations = this.currentData.relations;
        const memberMap = {};
        members.forEach(m => memberMap[m.id] = m);

        // 代际标签
        const generations = [...new Set(members.map(m => m.generation))].sort((a,b) => a - b);
        const romans = ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'];
        generations.forEach(gen => {
          const label = romans[gen - 1] || gen.toString();
          const memberInGen = members.find(m => m.generation === gen);
          if (memberInGen) this.addText(label, 30, memberInGen.positionY, 18, '#334155', true);
        });

        // 婚配线
        const spousePairs = [];
        relations.filter(r => r.relationType === 1).forEach(r => {
          const m1 = memberMap[r.fromMemberId], m2 = memberMap[r.toMemberId];
          if (m1 && m2) {
            this.addLine(m1.positionX, m1.positionY, m2.positionX, m2.positionY, '#0f172a', 2.2);
            spousePairs.push({ id1: r.fromMemberId, id2: r.toMemberId, x1: m1.positionX, y1: m1.positionY, x2: m2.positionX, y2: m2.positionY });
          }
        });

        const parentToChildren = {}, childParents = {};
        relations.filter(r => r.relationType === 2).forEach(r => {
          if (!parentToChildren[r.fromMemberId]) parentToChildren[r.fromMemberId] = [];
          parentToChildren[r.fromMemberId].push(r.toMemberId);
          if (!childParents[r.toMemberId]) childParents[r.toMemberId] = [];
          childParents[r.toMemberId].push(r.fromMemberId);
        });

        const processedChildren = new Set();
        // 绘制配偶-子女闭合竖线（完美闭合）
        spousePairs.forEach(pair => {
          const children1 = parentToChildren[pair.id1] || [];
          const children2 = parentToChildren[pair.id2] || [];
          const commonChildrenIds = children1.filter(cid => children2.includes(cid));
          if (commonChildrenIds.length === 0) return;
          const childMembers = commonChildrenIds.map(id => memberMap[id]).filter(Boolean);
          if (childMembers.length === 0) return;
          const minChildY = Math.min(...childMembers.map(c => c.positionY));
          const childLineY = minChildY - 42;
          const midX = (pair.x1 + pair.x2) / 2;
          const childXs = childMembers.map(c => c.positionX);
          const minX = Math.min(...childXs, midX);
          const maxX = Math.max(...childXs, midX);
          this.addLine(midX, pair.y1, midX, childLineY, '#0f172a', 2.2);
          if (Math.abs(maxX - minX) > 0.1) {
            this.addLine(minX, childLineY, maxX, childLineY, '#0f172a', 2.0);
          }
          childMembers.forEach(child => {
            const targetY = child.positionY - this.nodeSize/2;
            this.addLine(child.positionX, childLineY, child.positionX, targetY, '#0f172a', 2.0);
            processedChildren.add(child.id);
          });
        });

        // 处理单亲/未闭合的亲子关系 (以确保完整性)
        Object.keys(childParents).forEach(childId => {
          const child = memberMap[childId];
          if (!child || processedChildren.has(child.id)) return;
          const parents = childParents[childId];
          if (parents && parents.length) {
            parents.forEach(pid => {
              const parent = memberMap[pid];
              if (parent) {
                const endY = child.positionY - this.nodeSize/2;
                this.addLine(parent.positionX, parent.positionY, child.positionX, endY, '#0f172a', 1.8);
              }
            });
          }
        });

        // 绘制成员符号和先证者标志
        members.forEach(m => {
          this.drawSymbol(m.positionX, m.positionY, this.nodeSize, m.gender, m.healthStatus, m.name || m.id.toString());
          if (m.isProband === 1) {
            const iconX = m.positionX - this.nodeSize/2 - 6;
            const iconY = m.positionY + this.nodeSize/2 - 2;
            this.drawProbandIcon(iconX, iconY);
          }
        });

        this.layer.batchDraw();
        // 关键：每次绘制完毕后自动适配视图，确保所有成员可见
        this.$nextTick(() => { this.autoFitView(); });
      },
      drawSymbol(x, y, size, gender, healthStatus, label) {
        const half = size/2;
        const isCarrier = healthStatus === 2;
        const isAffected = healthStatus === 3;
        if (gender === 0 || (gender !== 1 && gender !== 2)) {
          const diamond = new Konva.RegularPolygon({ x, y, sides: 4, radius: half, fill: isAffected ? '#0f172a' : '#ffffff', stroke: '#0f172a', strokeWidth: 2.5, rotation: 45 });
          this.layer.add(diamond);
          if (isCarrier) {
            const halfDiamond = new Konva.Shape({
              x: x - half, y: y - half, width: size, height: size,
              sceneFunc: function(ctx) {
                ctx.beginPath(); ctx.moveTo(size/2, 0); ctx.lineTo(size, size/2); ctx.lineTo(size/2, size); ctx.lineTo(0, size/2); ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill();
                ctx.beginPath(); ctx.moveTo(size/2, 0); ctx.lineTo(size/2, size); ctx.lineTo(0, size/2); ctx.closePath(); ctx.fillStyle = '#0f172a'; ctx.fill();
                ctx.beginPath(); ctx.moveTo(size/2, 0); ctx.lineTo(size, size/2); ctx.lineTo(size/2, size); ctx.lineTo(0, size/2); ctx.closePath(); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5; ctx.stroke();
              }
            });
            this.layer.add(halfDiamond);
          }
        } else {
          const isMale = gender === 1;
          if (isCarrier) {
            if (isMale) {
              this.layer.add(new Konva.Shape({
                x: x - half, y: y - half, width: size, height: size,
                sceneFunc: function(ctx) {
                  ctx.beginPath(); ctx.rect(0,0,size,size); ctx.fillStyle='#fff'; ctx.fill();
                  ctx.beginPath(); ctx.rect(0,0,size/2,size); ctx.fillStyle='#0f172a'; ctx.fill();
                  ctx.beginPath(); ctx.rect(0,0,size,size); ctx.strokeStyle='#0f172a'; ctx.lineWidth=2.5; ctx.stroke();
                }
              }));
            } else {
              this.layer.add(new Konva.Shape({
                x: x - half, y: y - half, width: size, height: size,
                sceneFunc: function(ctx) {
                  ctx.beginPath(); ctx.arc(size/2, size/2, half, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
                  ctx.beginPath(); ctx.arc(size/2, size/2, half, Math.PI/2, Math.PI*1.5, false); ctx.closePath(); ctx.fillStyle='#0f172a'; ctx.fill();
                  ctx.beginPath(); ctx.arc(size/2, size/2, half, 0, Math.PI*2); ctx.strokeStyle='#0f172a'; ctx.lineWidth=2.5; ctx.stroke();
                }
              }));
            }
          } else {
            const shape = isMale ?
              new Konva.Rect({ x: x - half, y: y - half, width: size, height: size, fill: isAffected ? '#0f172a' : '#ffffff', stroke: '#0f172a', strokeWidth: 2.5, cornerRadius: 4 }) :
              new Konva.Circle({ x, y, radius: half, fill: isAffected ? '#0f172a' : '#ffffff', stroke: '#0f172a', strokeWidth: 2.5 });
            this.layer.add(shape);
          }
        }
        this.addText(label, x, y + half + 18, 11, '#1e293b');
      },
      drawProbandIcon(x, y) {
        const probandPath = 'M22,44C22,44,33,24.2,33,24.2C33,24.2,24.2,17.6,24.2,17.6C24.2,17.6,46.2,13.2,46.2,13.2C46.2,13.2,52.47,34.87,52.47,34.87C52.47,34.87,42.57,31.02,42.57,31.02C42.57,31.02,31.9,49.5,31.9,49.5';
        this.layer.add(new Konva.Path({ x, y, data: probandPath, fill: '#b91c1c', scaleX: 0.35, scaleY: 0.35 }));
      },
      addLine(x1,y1,x2,y2,color,width) {
        this.layer.add(new Konva.Line({ points:[x1,y1,x2,y2], stroke:color, strokeWidth:width, lineCap:'round', lineJoin:'round' }));
      },
      addText(text,x,y,size,color,bold=false) {
        const t = new Konva.Text({ x,y, text, fontSize:size, fontFamily:'PingFang SC,Microsoft YaHei,sans-serif', fill:color, fontStyle:bold?'bold':'normal', align:'center' });
        t.offsetX(t.width()/2); t.offsetY(t.height()/2);
        this.layer.add(t);
      }
    }
  });
})();
</script>
