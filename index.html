      align-items: center;
      gap: .5em;
      margin: .25em 0;

      width: .9em;
      height: .9em;

  <script charset="UTF-8" type="text/javascript">
    (function () {
      console.log('[YAYY Pedigree iframe] draw.html location:', window.location.href);
      var query = window.location.search || '';
      var isYayySource = /(?:\?|&)source=yayy(?:&|$)/.test(query);
      window.__isYayyPedigreeSource = isYayySource;

      function applyYayyEmbeddedMode() {
        if (!isYayySource || !document.body) return;
        document.body.classList.add('yayy-embedded-pedigree');

        var hiddenIds = [
          'action-back',
          'action-templates',
          'action-number',
          'action-pedigreeTitle',
          'action-save'
        ];
        for (var i = 0; i < hiddenIds.length; i += 1) {
          var item = document.getElementById(hiddenIds[i]);
          if (item) {
            item.style.display = 'none';
          }
        }

        ensureYayySexLegend();
      }

      function ensureYayySexLegend() {
        var workArea = document.getElementById('work-area');
        if (!workArea || document.getElementById('yayy-sex-legend')) return;

        var legendContainer = document.getElementById('legend-container');
        if (!legendContainer) {
          legendContainer = document.createElement('div');
          legendContainer.className = 'legend-container';
          legendContainer.id = 'legend-container';
          workArea.appendChild(legendContainer);
        }

        var legend = document.createElement('div');
        legend.className = 'yayy-sex-legend';
        legend.id = 'yayy-sex-legend';
        legend.innerHTML = [
          '<div class="yayy-sex-legend-title">性别</div>',
          '<ul class="yayy-sex-legend-list">',
          '<li><span class="yayy-sex-symbol male"></span><span>男性</span></li>',
          '<li><span class="yayy-sex-symbol female"></span><span>女性</span></li>',
          '</ul>'
        ].join('');
        legendContainer.insertBefore(legend, legendContainer.firstChild);
      }

      function dismissStartupTemplateSelector() {
        if (!isYayySource) return;
        var overlays = document.querySelectorAll('.pd-modal-overlay');
        for (var i = 0; i < overlays.length; i += 1) {
          if (overlays[i].querySelector('.pd-template-modal')) {
            overlays[i].parentNode.removeChild(overlays[i]);
          }
        }
      }

      function importYayyPedigreeData(data, retryCount) {
        if (!data || !data.length) return;
        dismissStartupTemplateSelector();

        if (window.editor && window.editor.getSaveLoadEngine) {
          window.__yayyPedigreeDataImported = true;
          window.editor.getSaveLoadEngine().importPedigreeData(data);
          dismissStartupTemplateSelector();
          return;
        }

        if (retryCount < 30) {
          setTimeout(function () {
            importYayyPedigreeData(data, retryCount + 1);
          }, 200);
        }
      }

      if (isYayySource) {
        applyYayyEmbeddedMode();
        dismissStartupTemplateSelector();
        var dismissCount = 0;
        var dismissTimer = setInterval(function () {
          applyYayyEmbeddedMode();
          dismissStartupTemplateSelector();
          dismissCount += 1;
          if (dismissCount > 30) {
            clearInterval(dismissTimer);
          }
        }, 200);
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'YAYY_PEDIGREE_DATA') return;
        if (window.__yayyPedigreeDataImported) return;
        importYayyPedigreeData(event.data.data, 0);
      });

      try {
        var storedData = window.localStorage.getItem('yayy_pedigree_data');
        if (storedData) {
          importYayyPedigreeData(JSON.parse(storedData), 0);
        }
      } catch (error) {
        console.warn('读取家系图谱数据失败', error);
      }
    })();

    if (!window.__isYayyPedigreeSource) {
      loadSampleData()
    }
  </script>
